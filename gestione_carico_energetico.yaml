
blueprint:
  name: Gestione carico energetico con auto-discovery e filtro entità (HA 2025)
  description: >
    Spegne dispositivi oltre una soglia e li riaccende sotto un'altra, con ritardo,
    priorità, controllo consumo, notifiche migliorate (service principale + Telegram + fallback),
    e filtro per tipo di entità. Compatibile con Home Assistant 2025.
  domain: automation
  input:

    sensore_consumo:
      name: Sensore consumo totale
      selector:
        entity:
          domain: sensor

    soglia_alta:
      name: Soglia massima (W)
      default: 2800
      selector:
        number:
          min: 1000
          max: 10000
          step: 100
          unit_of_measurement: W

    soglia_bassa:
      name: Soglia minima (W)
      default: 2000
      selector:
        number:
          min: 500
          max: 5000
          step: 100
          unit_of_measurement: W

    soglia_stop_riaccensione:
      name: Soglia di sicurezza riaccensione (W)
      default: 2500
      selector:
        number:
          min: 1000
          max: 10000
          step: 100
          unit_of_measurement: W

    ritardo_riaccensione:
      name: Ritardo prima di riaccendere (minuti)
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: min

    auto_discovery:
      name: Usa ricerca automatica dispositivi
      default: false
      selector:
        boolean: {}

    domini_inclusi:
      name: Tipi di entità da includere (auto-discovery)
      description: Seleziona i domini ammessi (es. switch, light, climate, fan)
      default:
        - switch
      selector:
        select:
          multiple: true
          options:
            - switch
            - light
            - climate
            - fan

    dispositivi_spegnimento:
      name: Dispositivi da spegnere (manuale)
      selector:
        entity:
          multiple: true

    dispositivi_riaccensione:
      name: Dispositivi da riaccendere (manuale)
      description: Se vuoto, verranno riaccesi i dispositivi spenti durante la riduzione.
      selector:
        entity:
          multiple: true

    esclusioni:
      name: Dispositivi da escludere (auto-discovery)
      selector:
        entity:
          multiple: true

    servizio_notifica:
      name: Servizio di notifica principale (es. notify.mobile_app_xxx)
      description: Lascia vuoto per usare persistent_notification come fallback.
      default: ""
      selector:
        text: {}

    servizio_telegram:
      name: Servizio Telegram (opzionale, es. telegram_bot.send_message)
      default: ""
      selector:
        text: {}

    usa_persistent_notification:
      name: Fallback su persistent_notification
      description: Se attivo, oltre ai servizi impostati verrà creato anche un messaggio persistente.
      default: true
      selector:
        boolean: {}

mode: queued
max: 10

# --- TRIGGER ------------------------------------------------------------
trigger:
  - platform: numeric_state
    entity_id: !input sensore_consumo
    above: !input soglia_alta
    id: alto

  - platform: numeric_state
    entity_id: !input sensore_consumo
    below: !input soglia_bassa
    id: basso

# --- VARIABILI ----------------------------------------------------------
# Mappiamo gli input su variabili utilizzabili nei template Jinja
variables:
  sensore: !input sensore_consumo
  s_alta: !input soglia_alta
  s_bassa: !input soglia_bassa
  s_stop: !input soglia_stop_riaccensione
  ritardo: !input ritardo_riaccensione
  auto: !input auto_discovery
  domini: !input domini_inclusi
  manual_off: !input dispositivi_spegnimento
  manual_on: !input dispositivi_riaccensione
  esclusi: !input esclusioni
  notify_service: !input servizio_notifica
  telegram_service: !input servizio_telegram
  use_pn: !input usa_persistent_notification

  # Stato runtime
  spenti: []

  # Ricerca automatica dei dispositivi accesi per i domini selezionati, escludendo gli indicati
  dispositivi_auto: >
    {% if auto %}
      {% set all_entities = states
         | selectattr('domain','in', domini)
         | selectattr('state','eq','on')
         | map(attribute='entity_id')
         | list %}
      {% set filtrati = all_entities | reject('in', esclusi) | list %}
      {{ filtrati }}
    {% else %}
      []
    {% endif %}

# --- AZIONI -------------------------------------------------------------
action:
  - choose:
      # CASO: CONSUMO ALTO -> Riduzione carico
      - conditions:
          - condition: trigger
            id: alto
        sequence:

          # Messaggio iniziale
          - variables:
              msg_alto: "⚠️ Consumo oltre {{ s_alta }} W! Avvio riduzione carico."

          # Notifica principale (se impostata)
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notify_service | length > 0 }}"
                sequence:
                  - service: "{{ notify_service }}"
                    data:
                      message: "{{ msg_alto }}"

          # Telegram (se impostato)
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ telegram_service | length > 0 }}"
                sequence:
                  - service: "{{ telegram_service }}"
                    data:
                      message: "{{ msg_alto }}"

          # Fallback persistent notification
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ use_pn }}"
                sequence:
                  - service: persistent_notification.create
                    data:
                      title: "Gestione carico"
                      message: "{{ msg_alto }}"

          # Lista dispositivi da spegnere: auto o manuale
          - variables:
              lista_spegnimento: >
                {% if auto %}
                  {{ dispositivi_auto }}
                {% else %}
                  {{ manual_off }}
                {% endif %}
              i: 0

          # Ciclo di riduzione: spegni finché consumo > soglia_bassa + 600 e ci sono elementi
          - repeat:
              while:
                - condition: template
                  value_template: "{{ (states(sensore) | float(0)) > (s_bassa + 600) }}"
                - condition: template
                  value_template: "{{ i < (lista_spegnimento | length) }}"
              sequence:
                - variables:
                    prossimo: "{{ lista_spegnimento[i] }}"
                - service: homeassistant.turn_off
                  target:
                    entity_id: "{{ prossimo }}"
                - variables:
                    spenti: "{{ (spenti + [prossimo]) | unique }}"
                - variables:
                    i: "{{ i + 1 }}"
                - delay:
                    seconds: 30

          # Notifica finale riduzione
          - variables:
              msg_riduzione: >
                {% if spenti | length > 0 %}
                  ✅ Riduzione completata. Dispositivi spenti: {{ spenti | join(', ') }}.
                {% else %}
                  ℹ️ Nessun dispositivo è stato spento (consumo rientrato prima dell'intervento).
                {% endif %}

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notify_service | length > 0 }}"
